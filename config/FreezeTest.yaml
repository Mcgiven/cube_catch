# Validation only: can a behavior run with learning_rate 0 (frozen via YAML)?
# If this starts without a TrainerConfigError, alternating rounds need no rebuild.
default_settings:
  trainer_type: ppo
  hyperparameters:
    batch_size: 1024
    buffer_size: 10240
    learning_rate: 0.0
    beta: 0.005
    epsilon: 0.2
    lambd: 0.95
    num_epoch: 3
  network_settings:
    normalize: true
    hidden_units: 128
    num_layers: 2
  reward_signals:
    extrinsic:
      gamma: 0.99
      strength: 1.0
  max_steps: 30000
  time_horizon: 64
  summary_freq: 10000

behaviors:
  Catcher:
    trainer_type: ppo
    init_path: F:\MLprogram\CatcherGame\results\catcher_warm\Catcher\checkpoint.pt
  Runner:
    trainer_type: ppo
