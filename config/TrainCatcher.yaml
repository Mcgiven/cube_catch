# Stage B: warm-start Catcher from the September checkpoint, train against the frozen
# Runner from arena12_v2 (1.5M steps). 4 processes x 12 arenas = 48 arenas;
# buffer_size scaled 4x so each agent still collects ~853 steps per update.
default_settings:
  trainer_type: ppo
  hyperparameters:
    batch_size: 1024
    buffer_size: 40960
    learning_rate: 3.0e-4
    beta: 0.005
    epsilon: 0.2
    lambd: 0.95
    num_epoch: 3
  network_settings:
    normalize: true
    hidden_units: 128
    num_layers: 2
  reward_signals:
    extrinsic:
      gamma: 0.99
      strength: 1.0
  max_steps: 1000000
  time_horizon: 64
  summary_freq: 10000

behaviors:
  Catcher:
    trainer_type: ppo
    init_path: F:\MLprogram\CatcherGame\results\catcher_finetune_v1\Catcher\Catcher-1000008.pt
  Runner:
    trainer_type: ppo
